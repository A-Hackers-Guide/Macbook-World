<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pomodoro</title>
<style>
  :root { color-scheme: dark; --bg:#1c1c22; --fg:#f4f4f6; --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.08); --accent:#ff6a6a; --dim: rgba(255,255,255,.55); --rest:#78d58b; }
  body[data-era="dawn"] { --bg:#fff; --fg:#000; --accent:#000; --card:#fff; --border:#000; --dim:#555; --rest:#000; font-family: ui-monospace, Menlo, monospace; }
  body[data-era="noon"] { --bg:#e4e6eb; --fg:#111; --accent:#ff3838; --card:#f5f6f8; --border:#70737e; --dim:#4a4a4e; --rest:#2fa14a; }
  body[data-era="dusk"] { --bg:#e8eef9; --fg:#10224a; --accent:#d9304b; --card: rgba(255,255,255,.65); --border: rgba(47,90,165,.3); --dim:#334a7a; --rest:#2a8a4a; }
  body[data-era="horizon"] { --bg:#fff6ea; --fg:#2a1a0a; --accent:#d96a2a; --card: rgba(255,228,180,.4); --border: rgba(255,170,100,.4); --dim:#8a5a2a; --rest:#6aad4a; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; overflow:hidden; }
  .wrap { height: 100%; display: grid; place-content: center; gap: 20px; padding: 20px; text-align: center; }
  .ring { position: relative; width: 260px; height: 260px; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--card); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .4s ease, stroke .3s; }
  .rest .ring-fg { stroke: var(--rest); }
  .time { position: absolute; inset: 0; display: grid; place-content: center; font-size: 48px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .phase { margin-top: 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .rest .phase { color: var(--rest); }
  .cycles { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 10px; justify-content: center; }
  .controls button { padding: 10px 24px; background: var(--accent); color: #fff; border: 0; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; font-size: 14px; }
  .controls button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  body[data-era="dawn"] .controls button { border-radius: 0; border: 2px solid #000; }
  body[data-era="dawn"] .controls button.ghost { background:#fff; color:#000; }
  .config { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; max-width: 320px; margin-left: auto; margin-right: auto; }
  .config label { display: block; font-size: 11px; color: var(--dim); text-transform: uppercase; }
  .config input { width: 100%; padding: 6px 10px; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; font: inherit; text-align: center; font-size: 14px; }
  body[data-era="dawn"] .config input { border-radius: 0; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div>
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54"/>
        <circle class="ring-fg" id="ring" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="0"/>
      </svg>
      <div class="time" id="time">25:00</div>
    </div>
    <div class="phase" id="phase">Focus</div>
    <div class="cycles" id="cycles">Completed today: 0</div>
  </div>
  <div class="controls">
    <button id="toggle">Start</button>
    <button class="ghost" id="skip">Skip</button>
    <button class="ghost" id="reset">Reset</button>
  </div>
  <div class="config">
    <div><label>Focus (min)</label><input id="focus-min" type="number" min="1" max="60" value="25"/></div>
    <div><label>Short break</label><input id="short-min" type="number" min="1" max="30" value="5"/></div>
    <div><label>Long break</label><input id="long-min" type="number" min="1" max="60" value="15"/></div>
  </div>
</div>
<script>
const era = new URLSearchParams(location.search).get("era") || window.PRISM_ERA || "nightfall";
document.body.dataset.era = era;
const NS = "prismos:v1:pomo";

let cfg = { focus: 25, short: 5, long: 15 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(NS + ":cfg")) || {}); } catch {}
document.getElementById("focus-min").value = cfg.focus;
document.getElementById("short-min").value = cfg.short;
document.getElementById("long-min").value = cfg.long;

const phases = ["focus","short","focus","short","focus","short","focus","long"];
let idx = 0, remaining = cfg.focus * 60, total = cfg.focus * 60, running = false, tick;

function phaseName(p) { return p === "focus" ? "Focus" : (p === "short" ? "Short Break" : "Long Break"); }
function phaseMin(p) { return p === "focus" ? cfg.focus : (p === "short" ? cfg.short : cfg.long); }

function fmt(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function render() {
  document.getElementById("time").textContent = fmt(remaining);
  document.getElementById("phase").textContent = phaseName(phases[idx]);
  document.getElementById("wrap").classList.toggle("rest", phases[idx] !== "focus");
  document.title = fmt(remaining) + " · Pomodoro";
  const r = document.getElementById("ring");
  const C = 2 * Math.PI * 54;
  const pct = remaining / total;
  r.style.strokeDashoffset = C * (1 - pct);
}
function updateCycles() {
  const today = new Date().toDateString();
  let data = {};
  try { data = JSON.parse(localStorage.getItem(NS + ":stats")) || {}; } catch {}
  document.getElementById("cycles").textContent = "Completed today: " + (data[today] || 0);
}
function completePhase() {
  if (phases[idx] === "focus") {
    const today = new Date().toDateString();
    let data = {};
    try { data = JSON.parse(localStorage.getItem(NS + ":stats")) || {}; } catch {}
    data[today] = (data[today] || 0) + 1;
    localStorage.setItem(NS + ":stats", JSON.stringify(data));
    updateCycles();
  }
  ding();
  idx = (idx + 1) % phases.length;
  remaining = phaseMin(phases[idx]) * 60;
  total = remaining;
  render();
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("Pomodoro", { body: phaseName(phases[idx]) + " started" });
  }
}
function ding() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 2; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880 + i*110;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.4);
      g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + i*0.4 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.4 + 0.45);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i*0.4); o.stop(ctx.currentTime + i*0.4 + 0.5);
    }
    setTimeout(() => ctx.close(), 2000);
  } catch {}
}
function start() {
  if (running) return;
  running = true;
  document.getElementById("toggle").textContent = "Pause";
  if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission().catch(()=>{});
  tick = setInterval(() => {
    remaining--;
    render();
    if (remaining <= 0) completePhase();
  }, 1000);
}
function pause() { running = false; clearInterval(tick); document.getElementById("toggle").textContent = "Start"; }
document.getElementById("toggle").addEventListener("click", () => { running ? pause() : start(); });
document.getElementById("skip").addEventListener("click", () => { pause(); completePhase(); });
document.getElementById("reset").addEventListener("click", () => { pause(); idx = 0; remaining = cfg.focus * 60; total = remaining; render(); });

for (const [k, id] of [["focus","focus-min"],["short","short-min"],["long","long-min"]]) {
  document.getElementById(id).addEventListener("change", () => {
    cfg[k] = Math.max(1, Math.min(60, +document.getElementById(id).value) || 1);
    localStorage.setItem(NS + ":cfg", JSON.stringify(cfg));
    if (!running) { remaining = phaseMin(phases[idx]) * 60; total = remaining; render(); }
  });
}
updateCycles(); render();
</script>
</body>
</html>
