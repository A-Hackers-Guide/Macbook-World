<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Password Generator</title>
<style>
  :root { color-scheme: dark; --bg:#1c1c22; --fg:#f4f4f6; --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.08); --accent:#78d58b; --dim: rgba(255,255,255,.55); }
  body[data-era="dawn"] { --bg:#fff; --fg:#000; --accent:#000; --card:#fff; --border:#000; --dim:#555; font-family: ui-monospace, Menlo, monospace; }
  body[data-era="noon"] { --bg:#e4e6eb; --fg:#111; --accent:#2a8a4a; --card:#f5f6f8; --border:#70737e; --dim:#4a4a4e; }
  body[data-era="dusk"] { --bg:#e8eef9; --fg:#10224a; --accent:#2a8a4a; --card: rgba(255,255,255,.65); --border: rgba(47,90,165,.3); --dim:#334a7a; }
  body[data-era="horizon"] { --bg:#fff6ea; --fg:#2a1a0a; --accent:#7aa94a; --card: rgba(255,228,180,.4); --border: rgba(255,170,100,.4); --dim:#8a5a2a; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; overflow:auto; }
  .wrap { padding: 24px; max-width: 480px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  .tagline { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
  .out {
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; align-items: center; margin-bottom: 14px;
  }
  body[data-era="dawn"] .out { border-radius: 0; }
  .out code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 17px; word-break: break-all; color: var(--accent); }
  .out button { padding: 8px 14px; background: var(--accent); color: #0a2d14; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
  body[data-era="dawn"] .out button { background:#000; color:#fff; border-radius:0; border:2px solid #000; }
  .strength { height: 6px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 18px; }
  .strength .fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s, background .3s; }
  .strength-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 4px; }

  .control { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .control:last-child { border-bottom: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .row label { font-size: 13px; font-weight: 600; }
  .row .val { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--accent); font-weight: 700; }
  input[type=range] { width: 100%; margin-top: 6px; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; }
  body[data-era="dawn"] .toggle { border-radius: 0; }
  .sw { width: 32px; height: 18px; background: rgba(255,255,255,.15); border-radius: 999px; position: relative; transition: background .2s; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .toggle.on .sw { background: var(--accent); }
  .toggle.on .sw::after { transform: translateX(14px); }
  body[data-era="dawn"] .sw { border-radius: 0; background: #ccc; border: 1px solid #000; }
  body[data-era="dawn"] .sw::after { border-radius: 0; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .copied { color: var(--accent); font-weight: 700; margin-left: 8px; opacity: 0; transition: opacity .3s; }
  .copied.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Password Generator</h1>
  <p class="tagline">Generated locally — never leaves your browser.</p>

  <div class="out">
    <code id="password">—</code>
    <button id="copy">Copy</button>
  </div>
  <div class="strength-label">
    <span>Strength: <strong id="strength-text">—</strong><span class="copied" id="copied">Copied</span></span>
    <span id="entropy">— bits</span>
  </div>
  <div class="strength"><div class="fill" id="strength-fill"></div></div>

  <div class="control">
    <div class="row"><label>Length</label><span class="val" id="len-val">20</span></div>
    <input type="range" min="4" max="64" value="20" id="length"/>
  </div>

  <div class="toggles">
    <div class="toggle on" data-k="lower"><span>abcde</span><div class="sw"></div></div>
    <div class="toggle on" data-k="upper"><span>ABCDE</span><div class="sw"></div></div>
    <div class="toggle on" data-k="digits"><span>01234</span><div class="sw"></div></div>
    <div class="toggle on" data-k="symbols"><span>!@#$%</span><div class="sw"></div></div>
    <div class="toggle" data-k="similar"><span>No lookalikes (il1Lo0O)</span><div class="sw"></div></div>
    <div class="toggle" data-k="passphrase"><span>Passphrase mode</span><div class="sw"></div></div>
  </div>

  <div class="meta">Uses <code>crypto.getRandomValues</code>. Rebuilt every time you change an option.</div>

  <div style="margin-top: 14px; text-align: center;">
    <button id="regen" style="padding:8px 20px;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:999px;font:inherit;cursor:pointer;">Generate again</button>
  </div>
</div>
<script>
const era = new URLSearchParams(location.search).get("era") || window.PRISM_ERA || "nightfall";
document.body.dataset.era = era;

const WORDS = ["amber","basil","cedar","delta","echo","fern","grove","hazel","iris","juno","kite","lotus","maple","noon","opal","peach","quill","raven","sage","thistle","umber","violet","willow","xenon","yarrow","zephyr","orbit","wave","cliff","dusk","dawn","meadow","river","harbor","summit","forge","mirror","garden","tower","prism","signal","pine","shore","vault","quartz","nova","beacon","compass","drift","ember","frost"];

const state = { lower: true, upper: true, digits: true, symbols: true, similar: false, passphrase: false };
let length = 20;

document.querySelectorAll(".toggle").forEach(t => {
  t.addEventListener("click", () => {
    const k = t.dataset.k;
    state[k] = !state[k];
    t.classList.toggle("on", state[k]);
    gen();
  });
});
document.getElementById("length").addEventListener("input", (e) => {
  length = +e.target.value;
  document.getElementById("len-val").textContent = length;
  gen();
});
document.getElementById("regen").addEventListener("click", gen);
document.getElementById("copy").addEventListener("click", async () => {
  const text = document.getElementById("password").textContent;
  try { await navigator.clipboard.writeText(text); }
  catch { // fallback
    const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
  const c = document.getElementById("copied");
  c.classList.add("show"); setTimeout(() => c.classList.remove("show"), 1200);
});

function randBytes(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return a;
}
function randInt(max) {
  const r = randBytes(4);
  return ((r[0]<<24)|(r[1]<<16)|(r[2]<<8)|r[3]) >>> 0 % max;
}
function pickFrom(chars) {
  const n = chars.length;
  const r = randBytes(4);
  const v = ((r[0]<<24)|(r[1]<<16)|(r[2]<<8)|r[3]) >>> 0;
  return chars[v % n];
}
function gen() {
  if (state.passphrase) {
    const count = Math.max(3, Math.min(8, Math.round(length / 6)));
    const parts = [];
    for (let i = 0; i < count; i++) parts.push(WORDS[randInt(WORDS.length) % WORDS.length]);
    // add a digit cluster
    let suffix = "";
    if (state.digits) for (let i = 0; i < 2; i++) suffix += pickFrom("0123456789");
    const pw = parts.join("-") + (suffix ? "-" + suffix : "");
    output(pw, estimateEntropy(pw, true, count));
    return;
  }
  let pool = "";
  if (state.lower) pool += "abcdefghijklmnopqrstuvwxyz";
  if (state.upper) pool += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if (state.digits) pool += "0123456789";
  if (state.symbols) pool += "!@#$%^&*()-_=+[]{};:,.<>?/";
  if (state.similar) pool = pool.replace(/[il1Lo0O]/g, "");
  if (!pool) pool = "abcdefghijklmnopqrstuvwxyz";
  let pw = "";
  for (let i = 0; i < length; i++) pw += pickFrom(pool);
  output(pw, length * Math.log2(pool.length));
}
function output(pw, bits) {
  document.getElementById("password").textContent = pw;
  const pct = Math.max(0, Math.min(100, Math.round(bits / 128 * 100)));
  document.getElementById("strength-fill").style.width = pct + "%";
  document.getElementById("entropy").textContent = Math.round(bits) + " bits";
  const label = bits >= 90 ? "Very strong" : bits >= 60 ? "Strong" : bits >= 40 ? "Fair" : "Weak";
  document.getElementById("strength-text").textContent = label;
  document.getElementById("strength-fill").style.background = bits >= 60 ? "var(--accent)" : bits >= 40 ? "#ffb258" : "#ff6a6a";
}
function estimateEntropy(pw, isPhrase, wordCount) {
  if (isPhrase) return wordCount * Math.log2(WORDS.length) + (/\d/.test(pw) ? 6 : 0);
  // rough pool size
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/\d/.test(pw)) pool += 10;
  if (/[^A-Za-z0-9]/.test(pw)) pool += 25;
  return pw.length * Math.log2(pool || 26);
}
gen();
</script>
</body>
</html>
