<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Snake</title>
<style>
  :root { color-scheme: dark; --bg:#0a0a14; --fg:#f4f4f6; --grid: rgba(255,255,255,.04); --snake:#78d58b; --head:#a9ffa9; --food:#ff5a6a; --accent:#a68cff; }
  body[data-era="dawn"] { --bg:#fff; --fg:#000; --grid:#eee; --snake:#000; --head:#333; --food:#000; font-family: ui-monospace, Menlo, monospace; }
  body[data-era="noon"] { --bg:#1e1e22; --fg:#f4f4f6; --grid: rgba(255,255,255,.05); --snake:#3c66ff; --head:#8baaff; --food:#ff6a9f; }
  body[data-era="dusk"] { --bg:#0d1830; --fg:#dfeeff; --grid: rgba(120,180,255,.08); --snake:#78b7ff; --head:#c3e9ff; --food:#ffb1c9; }
  body[data-era="primeval"] { --bg:#0a1a0a; --fg:#78ff78; --grid: rgba(120,255,120,.1); --snake:#78ff78; --head:#dfffdf; --food:#ffffb0; font-family: ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; overflow:hidden; }
  .app { display:grid; grid-template-rows: auto 1fr auto; height:100%; gap: 10px; padding: 10px; }
  .hud { display:flex; justify-content:space-between; padding: 6px 12px; font-variant-numeric: tabular-nums; }
  .hud span strong { font-weight: 600; margin-left: 4px; font-size: 16px; }
  .canvas-wrap { display:grid; place-content:center; position: relative; }
  canvas { background: var(--bg); box-shadow: 0 10px 40px rgba(0,0,0,.4); border-radius: 10px; }
  body[data-era="dawn"] canvas { border: 2px solid #000; border-radius: 0; box-shadow: 6px 6px 0 #000; }
  .overlay { position: absolute; inset: 0; display:grid; place-content:center; text-align:center; pointer-events: none; padding: 20px; }
  .overlay.show { pointer-events: auto; background: rgba(0,0,0,.6); border-radius: 10px; backdrop-filter: blur(4px); }
  .overlay h2 { font-size: 36px; margin: 0 0 4px; }
  .overlay p { color: rgba(255,255,255,.7); margin: 0 0 18px; }
  .overlay button { padding: 10px 20px; background: var(--accent); color: #fff; border: 0; border-radius: 999px; font: inherit; font-weight:600; cursor: pointer; font-size: 14px; }
  body[data-era="dawn"] .overlay button { border-radius: 0; border: 2px solid #fff; }
  .controls { display:flex; justify-content:center; gap:10px; padding-bottom: 6px; color: rgba(255,255,255,.5); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span>Best: <strong id="best">0</strong></span>
    <span>Length: <strong id="length">3</strong></span>
  </div>
  <div class="canvas-wrap">
    <canvas id="c" width="480" height="480"></canvas>
    <div class="overlay show" id="overlay">
      <div>
        <h2>Snake</h2>
        <p>Arrow keys or WASD to move · P to pause</p>
        <button id="start">Start game</button>
      </div>
    </div>
  </div>
  <div class="controls">Press any arrow to begin</div>
</div>
<script>
const era = new URLSearchParams(location.search).get("era") || window.PRISM_ERA || "nightfall";
document.body.dataset.era = era;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const CELL = 24, W = 20, H = 20;
canvas.width = CELL * W;
canvas.height = CELL * H;

const NS = "prismos:v1:snake";
const overlay = document.getElementById("overlay");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const lenEl = document.getElementById("length");

let snake, dir, nextDir, food, running, over, score, tickHandle, tickMs, best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  food = randFood();
  running = false; over = false;
  score = 0; tickMs = 140;
  best = parseInt(localStorage.getItem(NS + ":best") || "0", 10);
  updateHud();
  draw();
}
function randFood() {
  while (true) {
    const f = { x: Math.floor(Math.random()*W), y: Math.floor(Math.random()*H) };
    if (!snake.some(s => s.x===f.x && s.y===f.y)) return f;
  }
}
function tick() {
  if (!running || over) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H) return gameOver();
  if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    food = randFood();
    tickMs = Math.max(55, tickMs - 3);
  } else {
    snake.pop();
  }
  updateHud();
  draw();
  tickHandle = setTimeout(tick, tickMs);
}
function draw() {
  const style = getComputedStyle(document.body);
  ctx.fillStyle = style.getPropertyValue("--bg").trim() || "#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid
  ctx.strokeStyle = style.getPropertyValue("--grid").trim();
  ctx.lineWidth = 1;
  for (let i = 0; i <= W; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL + .5, 0); ctx.lineTo(i*CELL + .5, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL + .5); ctx.lineTo(canvas.width, i*CELL + .5); ctx.stroke();
  }
  // food
  ctx.fillStyle = style.getPropertyValue("--food").trim();
  const f = food;
  ctx.beginPath(); ctx.arc(f.x*CELL + CELL/2, f.y*CELL + CELL/2, CELL/2 - 3, 0, Math.PI*2); ctx.fill();
  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? style.getPropertyValue("--head").trim() : style.getPropertyValue("--snake").trim();
    const r = i === 0 ? 4 : 4;
    const pad = 2;
    roundRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2, r);
    ctx.fill();
  });
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  lenEl.textContent = snake.length;
}
function start() {
  if (over) reset();
  overlay.classList.remove("show");
  running = true;
  clearTimeout(tickHandle);
  tickHandle = setTimeout(tick, tickMs);
}
function pause() {
  running = false;
  clearTimeout(tickHandle);
  overlay.innerHTML = `<div><h2>Paused</h2><p>P to resume</p><button id="start">Resume</button></div>`;
  overlay.classList.add("show");
  document.getElementById("start").addEventListener("click", start);
}
function gameOver() {
  over = true; running = false;
  if (score > best) { best = score; localStorage.setItem(NS + ":best", String(best)); }
  overlay.innerHTML = `<div><h2>Game Over</h2><p>Score ${score} · Best ${best}</p><button id="start">Play again</button></div>`;
  overlay.classList.add("show");
  document.getElementById("start").addEventListener("click", start);
  updateHud();
}
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  const map = { arrowup:[0,-1], arrowdown:[0,1], arrowleft:[-1,0], arrowright:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  const vec = map[k];
  if (vec) {
    const [x,y] = vec;
    if (snake && (dir.x !== -x || dir.y !== -y)) nextDir = { x, y };
    if (!running && !over) start();
    e.preventDefault();
  } else if (k === "p") {
    if (over) return;
    if (running) pause(); else start();
  }
});
document.getElementById("start").addEventListener("click", start);
reset();
</script>
</body>
</html>
