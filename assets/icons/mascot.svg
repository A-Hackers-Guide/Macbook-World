<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prism mascot">
  <defs>
    <linearGradient id="prism-face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#eaeaff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d7d0ff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="prism-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8c8ff"/>
      <stop offset="50%" stop-color="#8f6aff"/>
      <stop offset="100%" stop-color="#ff7ab6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <path d="M8 80 h40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <path d="M80 26
           Q82 24 84 27
           L132 115
           Q134 120 128 121
           L32 121
           Q26 120 28 115
           L76 27
           Q78 24 80 26 Z"
        fill="url(#prism-face)"
        stroke="url(#prism-edge)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <g stroke-linecap="round" stroke-width="3.5" filter="url(#soft)">
    <line x1="112" y1="92"  x2="154" y2="62"  stroke="#ff7b7b"/>
    <line x1="116" y1="97"  x2="156" y2="78"  stroke="#ffb258"/>
    <line x1="118" y1="102" x2="158" y2="98"  stroke="#ffd56a"/>
    <line x1="118" y1="107" x2="158" y2="116" stroke="#78d58b"/>
    <line x1="116" y1="111" x2="154" y2="130" stroke="#78b7ff"/>
  </g>

  <ellipse cx="70" cy="86" rx="3.6" ry="4.6" fill="#1a1a2a"/>
  <ellipse cx="90" cy="86" rx="3.6" ry="4.6" fill="#1a1a2a"/>
  <circle  cx="71.2" cy="84.4" r="1.1" fill="#ffffff"/>
  <circle  cx="91.2" cy="84.4" r="1.1" fill="#ffffff"/>
  <path d="M68 100 Q80 109 92 100" stroke="#1a1a2a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</svg>
